# Integração contínua do frontend: formatação, testes unitários, build de produção e testes E2E
# contra o backend verdadeiro (repositório ngola-health-backend) com MySQL real.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatação, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Formatação (Prettier)
        run: npx prettier --check src e2e playwright.config.ts
      - name: Testes unitários
        run: npx ng test --watch=false
      - name: Build de produção
        run: npx ng build
      - name: Tipos dos testes E2E
        run: npx tsc -p e2e/tsconfig.json

  e2e:
    name: Testes E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          path: frontend
      # O backend vive noutro repositório. Se for privado, crie o segredo BACKEND_REPO_TOKEN
      # (token só de leitura desse repositório); ver frontend/.github/CI.md.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/ngola-health-backend
          ref: main
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Segredo JWT efémero
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Compilar o backend (acelera o arranque)
        working-directory: backend
        run: ./mvnw -B -ntp -q -DskipTests compile

      - name: Dependências e browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        working-directory: frontend
        run: npx playwright test

      - name: Relatório Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  secrets:
    name: Segredos no repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (todo o histórico)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1
