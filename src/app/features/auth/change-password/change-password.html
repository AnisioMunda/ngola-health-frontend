<main class="auth-page">
  <section class="card auth-card">
    <h1>Alterar senha</h1>
    @if (mandatory()) {
      <div class="alert alert-info" role="status">
        Por segurança, defina uma senha pessoal antes de continuar.
      </div>
    }
    @if (error(); as message) {
      <div class="alert alert-error" role="alert">{{ message }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Senha actual</span>
        <input formControlName="currentPassword" type="password" autocomplete="current-password" />
        @if (form.controls.currentPassword.invalid && form.controls.currentPassword.touched) {
          <small class="field-error">Indique a senha actual.</small>
        }
      </label>
      <label class="field">
        <span>Nova senha</span>
        <input formControlName="newPassword" type="password" autocomplete="new-password" />
        <small class="muted">{{ hint }}</small>
        @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
          <small class="field-error">A senha não cumpre os requisitos.</small>
        }
      </label>
      <label class="field">
        <span>Confirmar nova senha</span>
        <input formControlName="confirmation" type="password" autocomplete="new-password" />
        @if (form.hasError('mismatch') && form.controls.confirmation.touched) {
          <small class="field-error">As senhas não coincidem.</small>
        }
      </label>

      <div class="form-actions">
        @if (mandatory()) {
          <button class="btn btn-secondary" type="button" (click)="logout()">
            Terminar sessão
          </button>
        } @else {
          <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
        }
        <button class="btn btn-primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'A guardar…' : 'Alterar senha' }}
        </button>
      </div>
    </form>
  </section>
</main>
