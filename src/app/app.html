<header class="topbar">
  <a class="brand" routerLink="/">Ngola Health</a>
  <nav aria-label="Navegação principal">
    <a routerLink="/hospitals" routerLinkActive="active">Hospitais</a>
  </nav>
  <span
    class="status"
    role="status"
    [class.up]="backendStatus() === 'UP'"
    [class.down]="backendStatus() === 'DOWN'"
  >
    @switch (backendStatus()) {
      @case ('UP') {
        Backend disponível
      }
      @case ('DOWN') {
        Backend indisponível
      }
      @default {
        A verificar o backend…
      }
    }
  </span>
</header>
<main>
  <router-outlet />
</main>
