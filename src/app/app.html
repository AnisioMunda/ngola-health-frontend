<main class="foundation">
  <h1>Ngola Health</h1>
  <p class="status" [class.up]="backendStatus() === 'UP'" [class.down]="backendStatus() === 'DOWN'">
    @switch (backendStatus()) {
      @case ('UP') {
        Backend disponível
      }
      @case ('DOWN') {
        Backend indisponível
      }
      @default {
        A verificar o backend…
      }
    }
  </p>
</main>
<router-outlet />
